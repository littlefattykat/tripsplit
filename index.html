<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>TripSplit v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 90px)}button,input,select,textarea{font:inherit}.top,.row{display:flex;align-items:center;gap:10px}.top{justify-content:space-between;margin-bottom:20px}.brand{color:#67e8f9;font-size:12px;font-weight:800;letter-spacing:.2em}h1{margin:4px 0 0;font-size:30px}h2,h3,p{margin:0}.btn{border:1px solid #ffffff18;background:#ffffff0d;color:#fff;border-radius:14px;padding:12px;font-weight:750;cursor:pointer}.primary{background:#a3e635;color:#111827;border-color:#84cc16}.cyan{background:#67e8f9;color:#0f172a;border-color:#22d3ee}.hero,.card,.summary{border:1px solid #ffffff15;background:#ffffff08;border-radius:24px}.hero{padding:22px;background:linear-gradient(135deg,#7c3aed42,#22d3ee18,#a3e63518);margin-bottom:22px}.hero h2{font-size:23px;max-width:390px;margin:8px 0 18px}.cards{display:grid;gap:11px}.card{padding:14px}.trip{width:100%;display:flex;text-align:left;align-items:center;gap:13px;color:#fff}.emoji{width:52px;height:52px;border-radius:16px;background:#ffffff12;display:grid;place-items:center;font-size:24px}.grow{flex:1;min-width:0}.muted{color:#9696a1;font-size:13px}.total,.plus{color:#6ee7b7}.minus{color:#fda4af}.summary{padding:21px;background:linear-gradient(140deg,#17323a,#17131f)}.big{font-size:36px;font-weight:800;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.members{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.member{padding:10px;border:1px solid #ffffff12;background:#ffffff08;border-radius:16px;min-width:0}.member b,.member small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#ffffff0a;padding:4px;border-radius:15px;margin:15px 0}.tabs button{border:0;background:transparent;color:#8b8b95;padding:10px 5px;border-radius:11px;font-size:13px}.tabs .on{background:#ffffff14;color:#fff}.expense{display:flex;align-items:center;gap:10px}.badge{font-size:11px;background:#ffffff12;padding:4px 7px;border-radius:99px}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;padding:11px 16px calc(env(safe-area-inset-bottom) + 11px);background:#111113ea;border-top:1px solid #ffffff13;backdrop-filter:blur(18px)}.bottom button{width:100%}.overlay{position:fixed;z-index:10;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(7px)}.modal{width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px;background:#151518;border:1px solid #ffffff16}.between{justify-content:space-between}.field{margin:0 0 14px}.field label{display:block;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:7px}.input,select,textarea{width:100%;background:#ffffff0a;border:1px solid #ffffff19;color:#fff;border-radius:13px;padding:13px}select option{color:#000}textarea{min-height:74px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:2px solid #52525b;background:#27272a;color:#f4f4f5;border-radius:99px;padding:10px 14px;font-weight:750}.chip.selected{background:#67e8f9;border-color:#22d3ee;color:#082f49}.chip.all.selected{background:#a3e635;border-color:#84cc16;color:#111827}.notice{padding:12px;border-radius:13px;background:#22d3ee12;color:#bae6fd;font-size:13px;margin-bottom:14px}.empty{text-align:center;color:#888;padding:32px;border:1px dashed #ffffff18;border-radius:20px}.hidden{display:none!important}.settle{border-left:4px solid #a3e635}.delete{color:#fda4af}.actions{display:flex;gap:8px}.actions>*{flex:1}@media(min-width:650px){.overlay{align-items:center}.modal{border-radius:28px}}
</style></head><body><div id="app"></div><input id="importer" type="file" accept="application/json" class="hidden"><script>
const CUR=['USD','EUR','GBP','SGD','VND','THB','AUD','JPY','KRW','CNY','MYR','IDR','PHP','CAD','CHF','INR'],SYM={USD:'$',EUR:'€',GBP:'£',SGD:'S$',VND:'₫',THB:'฿',AUD:'A$',JPY:'¥',KRW:'₩',CNY:'¥',MYR:'RM',IDR:'Rp',PHP:'₱',CAD:'C$',CHF:'CHF ',INR:'₹'},uid=()=>crypto.randomUUID(),today=()=>new Date().toISOString().slice(0,10),fmt=(n,c)=>(SYM[c]||c+' ')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let db=JSON.parse(localStorage.getItem('tripsplit-v2')||'null')||{trips:[],view:'home',tripId:null,tab:'expenses'};const persist=()=>{localStorage.setItem('tripsplit-v2',JSON.stringify(db));render()},curTrip=()=>db.trips.find(t=>t.id===db.tripId);
function participants(e,t){return e.splitMode==='all'?t.members.map(m=>m.id):(e.people||[])}
function calc(t){let paid={},owed={};t.members.forEach(m=>paid[m.id]=owed[m.id]=0);t.expenses.forEach(e=>{let ps=participants(e,t),a=+e.amount*(t.rates[e.currency]||0);paid[e.payer]=(paid[e.payer]||0)+a;if(ps.length)ps.forEach(x=>owed[x]=(owed[x]||0)+a/ps.length)});let bal={};t.members.forEach(m=>bal[m.id]=paid[m.id]-owed[m.id]);let cr=t.members.map(m=>[m.id,bal[m.id]]).filter(x=>x[1]>.005).sort((a,b)=>b[1]-a[1]),dr=t.members.map(m=>[m.id,-bal[m.id]]).filter(x=>x[1]>.005).sort((a,b)=>b[1]-a[1]),settles=[],i=0,j=0;while(i<dr.length&&j<cr.length){let a=Math.min(dr[i][1],cr[j][1]);settles.push({from:dr[i][0],to:cr[j][0],amount:a});dr[i][1]-=a;cr[j][1]-=a;if(dr[i][1]<.005)i++;if(cr[j][1]<.005)j++}return{paid,owed,bal,settles}}
function render(){document.querySelector('#app').innerHTML=db.view==='home'?home():trip(curTrip());bind()}
function home(){return `<main class="app"><header class="top"><div><div class="brand">TRIPSPLIT V2</div><h1>Your trips</h1></div><button class="btn" data-act="tools">☾</button></header><section class="hero"><div class="muted">Travel together</div><h2>Split every cost without the awkward maths.</h2><button class="btn primary" data-act="new">＋ New trip</button></section><div class="row between" style="margin-bottom:10px"><b>Recent trips</b><span class="badge">${db.trips.length}</span></div><section class="cards">${db.trips.length?db.trips.map(t=>`<button class="card trip" data-open="${t.id}"><span class="emoji">🧳</span><span class="grow"><b>${esc(t.name)}</b><span class="muted" style="display:block">${t.members.length} people · ${t.expenses.length} expenses</span><span class="total">${fmt(t.expenses.reduce((s,e)=>s+(+e.amount*(t.rates[e.currency]||0)),0),t.base)}</span></span><b>›</b></button>`).join(''):'<div class="empty">Create your first trip.</div>'}</section></main>`}
function trip(t){if(!t){db.view='home';return home()}let c=calc(t),name=id=>t.members.find(m=>m.id===id)?.name||'?',total=t.expenses.reduce((s,e)=>s+(+e.amount*(t.rates[e.currency]||0)),0);let content=db.tab==='expenses'?(t.expenses.length?t.expenses.slice().reverse().map(e=>{let ps=participants(e,t);return `<div class="card expense"><span class="emoji" style="width:42px;height:42px">🧾</span><div class="grow"><div class="row"><b>${esc(e.note)}</b><span class="badge">${e.currency}</span></div><div class="muted">${esc(name(e.payer))} paid · ${e.splitMode==='all'?'ALL equally':ps.map(name).join(', ')}</div></div><b>${fmt(e.amount,e.currency)}</b><button class="btn" data-edit="${e.id}">✎</button></div>`}).join(''):'<div class="empty">No expenses yet.</div>'):db.tab==='balances'?t.members.map(m=>`<div class="card row between"><div><b>${esc(m.name)}</b><div class="muted">Paid ${fmt(c.paid[m.id],t.base)} · Share ${fmt(c.owed[m.id],t.base)}</div></div><b class="${c.bal[m.id]>=0?'plus':'minus'}">${fmt(c.bal[m.id],t.base)}</b></div>`).join(''):(c.settles.length?c.settles.map(s=>`<div class="card settle row between"><div><b>${esc(name(s.from))}</b><div class="muted">pays ${esc(name(s.to))}</div></div><b class="plus">${fmt(s.amount,t.base)}</b></div>`).join(''):'<div class="empty">Everyone is settled.</div>');return `<main class="app"><header class="top"><button class="btn" data-act="back">‹</button><b>🧳 ${esc(t.name)}</b><button class="btn delete" data-act="deleteTrip">⌫</button></header><section class="summary"><div class="muted">Total trip spend</div><div class="big">${fmt(total,t.base)}</div><div class="grid2"><button class="btn" data-act="rates">⇄ Rates</button><button class="btn primary" data-act="settleCurrency">✓ Settlement currency</button></div></section><section class="members">${t.members.map(m=>`<div class="member"><b>${esc(m.name)}</b><small class="${c.bal[m.id]>=0?'plus':'minus'}">${c.bal[m.id]>0?'gets '+fmt(c.bal[m.id],t.base):c.bal[m.id]<0?'owes '+fmt(-c.bal[m.id],t.base):'settled'}</small></div>`).join('')}</section><nav class="tabs"><button class="${db.tab==='expenses'?'on':''}" data-tab="expenses">Expenses</button><button class="${db.tab==='balances'?'on':''}" data-tab="balances">Balances</button><button class="${db.tab==='settle'?'on':''}" data-tab="settle">Who pays whom</button></nav><section class="cards">${content}</section></main><footer class="bottom"><button class="btn cyan" data-act="expense">＋ Add expense</button></footer>`}
const field=(l,h)=>`<div class="field"><label>${l}</label>${h}</div>`,input=(id,p='',type='text',v='')=>`<input class="input" id="${id}" placeholder="${p}" type="${type}" value="${esc(v)}">`,select=(id,a,v)=>`<select id="${id}">${a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><section class="modal"><div class="top"><h2>${title}</h2><button class="btn" data-close>✕</button></div>${body}</section></div>`);document.querySelector('[data-close]').onclick=close}const close=()=>document.querySelector('.overlay')?.remove();
function newTrip(){modal('Create trip',field('Trip name',input('tn','Bangkok getaway'))+`<div class="grid2">${field('People',input('tc','','number','3'))}${field('Base currency',select('tb',CUR,'SGD'))}</div>`+field('Names, one per line','<textarea id="names" placeholder="Thao\nLinh\nMai"></textarea>')+'<button class="btn primary" id="create" style="width:100%">Create</button>');document.querySelector('#create').onclick=()=>{let names=document.querySelector('#names').value.split('\n').map(x=>x.trim()).filter(Boolean),n=+document.querySelector('#tc').value;if(!document.querySelector('#tn').value.trim()||names.length!==n)return alert('Enter exactly '+n+' names.');let base=document.querySelector('#tb').value,t={id:uid(),name:document.querySelector('#tn').value.trim(),base,members:names.map(name=>({id:uid(),name})),expenses:[],rates:{[base]:1},rateMeta:{[base]:{date:today(),source:'Base'}}};db.trips.push(t);db.tripId=t.id;db.view='trip';close();persist()}}
function parseNL(s,t){let all=/\b(for all|for everyone|for everybody|all members|split equally|shared equally|for the group|group expense)\b/i.test(s),am=s.match(/(?:^|\s)(\d+(?:[.,]\d+)?)(?:\s|$)/),cm=s.match(new RegExp('\\b('+CUR.join('|')+')\\b','i')),payer=t.members.find(m=>s.toLowerCase().includes(m.name.toLowerCase())),tail=(s.match(/(?:for|among|between)\s+(.+)$/i)||[])[1]||'',people=all?[]:t.members.filter(m=>tail.toLowerCase().includes(m.name.toLowerCase())).map(m=>m.id);return{all,amount:am?.[1].replace(',','.')||'',currency:cm?.[1].toUpperCase()||t.base,payer:payer?.id||t.members[0].id,people}}
function expense(t,e){let edit=!!e;e=e||{id:uid(),note:'',amount:'',currency:t.base,payer:t.members[0].id,splitMode:'all',people:[]};modal(edit?'Edit expense':'Add expense',field('Natural language',`<textarea id="nl" placeholder="${esc(t.members[0].name)} paid 120 SGD for dinner for all"></textarea><button class="btn cyan" id="parse">Fill details</button>`)+field('Expense note',input('note','Dinner, taxi, hotel','text',e.note))+`<div class="grid2">${field('Amount',input('amount','0','number',e.amount))}${field('Currency',select('currency',CUR,e.currency))}</div>`+field('Paid by',`<select id="payer">${t.members.map(m=>`<option value="${m.id}" ${m.id===e.payer?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`)+field('Paid for',`<div class="chips"><button class="chip all ${e.splitMode==='all'?'selected':''}" data-all>ALL · split equally</button>${t.members.map(m=>`<button class="chip ${e.splitMode==='selected'&&e.people.includes(m.id)?'selected':''}" data-person="${m.id}">${esc(m.name)}</button>`).join('')}</div>`)+`<div class="actions">${edit?'<button class="btn delete" id="del">Delete</button>':''}<button class="btn primary" id="save">Save expense</button></div>`);let all=document.querySelector('[data-all]');function pickAll(){all.classList.add('selected');document.querySelectorAll('[data-person]').forEach(x=>x.classList.remove('selected'))}all.onclick=pickAll;document.querySelectorAll('[data-person]').forEach(x=>x.onclick=()=>{all.classList.remove('selected');x.classList.toggle('selected')});document.querySelector('#parse').onclick=()=>{let p=parseNL(document.querySelector('#nl').value,t);document.querySelector('#amount').value=p.amount;document.querySelector('#currency').value=p.currency;document.querySelector('#payer').value=p.payer;if(p.all)pickAll();else{all.classList.remove('selected');document.querySelectorAll('[data-person]').forEach(x=>x.classList.toggle('selected',p.people.includes(x.dataset.person)))}};if(edit)document.querySelector('#del').onclick=()=>{t.expenses=t.expenses.filter(x=>x.id!==e.id);close();persist()};document.querySelector('#save').onclick=()=>{let isAll=all.classList.contains('selected'),people=[...document.querySelectorAll('[data-person].selected')].map(x=>x.dataset.person);if(!document.querySelector('#note').value||+document.querySelector('#amount').value<=0||(!isAll&&!people.length))return alert('Complete the expense and choose ALL or at least one member.');Object.assign(e,{note:document.querySelector('#note').value,amount:+document.querySelector('#amount').value,currency:document.querySelector('#currency').value,payer:document.querySelector('#payer').value,splitMode:isAll?'all':'selected',people:isAll?[]:people});if(!edit)t.expenses.push(e);close();persist()}}
function rates(t){modal('Exchange rates',`<div class="notice">Enter how many ${t.base} equal 1 unit of the foreign currency.</div><div class="cards">${Object.entries(t.rates).map(([c,v])=>`<div class="card">1 ${c} = ${v} ${t.base}</div>`).join('')}</div><br><div class="grid2">${field('Currency',select('rc',CUR.filter(c=>c!==t.base),'USD'))}${field('Date',input('rd','','date',today()))}</div>${field('Rate',input('rr','1.34','number'))}<div class="actions"><button class="btn cyan" id="auto">Auto lookup</button><button class="btn" id="google">Google verify</button><button class="btn primary" id="sr">Save</button></div>`);document.querySelector('#google').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent(`1 ${document.querySelector('#rc').value} to ${t.base} on ${document.querySelector('#rd').value}`),'_blank');document.querySelector('#auto').onclick=async()=>{try{let c=document.querySelector('#rc').value,j=await fetch(`https://api.frankfurter.app/${document.querySelector('#rd').value}?from=${c}&to=${t.base}`).then(r=>r.json());document.querySelector('#rr').value=j.rates[t.base]}catch{alert('Lookup unavailable. Use Google verify and enter manually.')}};document.querySelector('#sr').onclick=()=>{let c=document.querySelector('#rc').value,v=+document.querySelector('#rr').value;if(v<=0)return;t.rates[c]=v;t.rateMeta[c]={date:document.querySelector('#rd').value,source:'verified'};close();persist()}}
function settleCurrency(t){let c=calc(t),used=[...new Set(t.expenses.map(e=>e.currency))].filter(x=>t.rates[x]),name=x=>t.members.find(m=>m.id===x)?.name;modal('Settlement method',field('Settle in currency',select('sc',used.length?used:[t.base],t.base))+'<div id="result"></div>');let draw=()=>{let cur=document.querySelector('#sc').value,rate=t.rates[cur]||1;document.querySelector('#result').innerHTML=c.settles.length?c.settles.map(s=>`<div class="card settle row between" style="margin-bottom:9px"><span><b>${esc(name(s.from))}</b> pays ${esc(name(s.to))}</span><b>${fmt(s.amount/rate,cur)}</b></div>`).join(''):'<div class="empty">Everyone is settled.</div>'};document.querySelector('#sc').onchange=draw;draw()}
function tools(){modal('Data tools','<div class="cards"><button class="btn" id="export">Export JSON backup</button><button class="btn" id="import">Import JSON backup</button><button class="btn primary" id="share">Share app</button></div>');document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='tripsplit-v2-backup.json';a.click()};document.querySelector('#import').onclick=()=>document.querySelector('#importer').click();document.querySelector('#share').onclick=()=>navigator.share?navigator.share({title:'TripSplit',url:location.href}):navigator.clipboard.writeText(location.href)}
function bind(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{db.tripId=x.dataset.open;db.view='trip';persist()});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{db.tab=x.dataset.tab;persist()});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{let t=curTrip();expense(t,t.expenses.find(e=>e.id===x.dataset.edit))});document.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>{let a=x.dataset.act,t=curTrip();if(a==='new')newTrip();if(a==='back'){db.view='home';persist()}if(a==='expense')expense(t);if(a==='rates')rates(t);if(a==='settleCurrency')settleCurrency(t);if(a==='tools')tools();if(a==='deleteTrip'&&confirm('Delete this trip?')){db.trips=db.trips.filter(y=>y.id!==t.id);db.view='home';persist()}})}
document.querySelector('#importer').onchange=e=>{let fr=new FileReader();fr.onload=()=>{try{db=JSON.parse(fr.result);persist()}catch{alert('Invalid backup')}};fr.readAsText(e.target.files[0])};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
